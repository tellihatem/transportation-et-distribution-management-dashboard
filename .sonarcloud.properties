# SonarCloud Automatic Analysis configuration.
#
# dist-server/ is COMPILED OUTPUT (tsc renders server/*.ts to JS) that this
# project deliberately commits so the packaged Electron build never ships a
# stale server. Analyzing it double-counts every finding and registers each
# file as a near-line-for-line duplicate of its TypeScript source — which is
# what tripped the duplication quality gate. Build artifacts are not code
# under review; exclude them wholesale. dist/ is the Vite bundle, same story.
sonar.exclusions=dist-server/**,dist/**
