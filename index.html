<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>شركة لعلاوي عبد الرحيم لبيع مواد البناء</title>
</head>

<body>
  <div id="root"></div>
  <!-- Applies the saved theme before React mounts, so a light-mode user never
       sees the dark palette flash on the way in. -->
  <script>
    try {
      if (localStorage.getItem('theme') === 'light') document.documentElement.dataset.theme = 'light';
    } catch (e) { /* storage blocked: fall back to the dark default */ }
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
