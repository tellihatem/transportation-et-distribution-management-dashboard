services:
  - type: web
    name: logistics-financial-dashboard
    runtime: node
    plan: free
    # NOTE: no persistent disk on the free plan, so DATABASE_PATH below lives
    # in the container's ephemeral filesystem. Data survives while the
    # service is running, but resets on every redeploy and whenever the
    # free-tier service spins down from inactivity. Fine for a one-sitting
    # demo; if you need data to persist long-term, either upgrade to a paid
    # plan and re-add a disk mounted at e.g. /data (update DATABASE_PATH to
    # match), or migrate the datastore to a hosted DB like Supabase.
    buildCommand: npm install && npm run build && npm run build:server
    startCommand: node dist-server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      # logistics.v2.db, matching the desktop build. The app quarantines any
      # database created by a pre-epoch build (renames it aside and starts
      # fresh) — on the free tier the disk is ephemeral anyway, but if this is
      # ever deployed on a persistent disk that held data from an old build,
      # expect exactly that one-time fresh start.
      - key: DATABASE_PATH
        value: ./data/logistics.v2.db
      - key: APP_PASSWORD
        sync: false # set the client's login password in the Render dashboard
      - key: SESSION_SECRET
        generateValue: true # Render generates a secure random value automatically
      - key: CORS_ORIGIN
        sync: false # set to your Render URL (e.g. https://logistics-financial-dashboard.onrender.com) after first deploy
      - key: SUPABASE_URL
        sync: false # optional — leave unset unless enabling cloud backup sync
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false # optional — leave unset unless enabling cloud backup sync
      - key: SYNC_INTERVAL_MS
        value: "300000"
