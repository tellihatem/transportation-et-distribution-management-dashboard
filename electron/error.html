<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>لوحة التحكم</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(160deg, #0f172a 0%, #111827 50%, #020617 100%);
        color: #e5e7eb;
      }
      main {
        max-width: 32rem;
        padding: 2rem;
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 1rem;
        background: rgba(15, 23, 42, 0.8);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.5rem;
      }
      p {
        margin: 0;
        line-height: 1.6;
        color: #cbd5e1;
      }
      /* The technical reason. LTR because it is an English error string, and
         selectable so it can be copied into a support message as-is. */
      pre {
        direction: ltr;
        text-align: left;
        margin: 1rem 0 0;
        padding: 0.75rem 1rem;
        border-radius: 0.5rem;
        background: rgba(2, 6, 23, 0.7);
        border: 1px solid rgba(148, 163, 184, 0.25);
        color: #fca5a5;
        font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
        font-size: 0.8rem;
        white-space: pre-wrap;
        word-break: break-all;
        user-select: text;
        max-height: 12rem;
        overflow-y: auto;
      }
      .logline {
        margin-top: 0.75rem;
        font-size: 0.75rem;
        color: #94a3b8;
      }
      .logline code {
        direction: ltr;
        unicode-bidi: embed;
        font-size: 0.72rem;
        color: #cbd5e1;
        word-break: break-all;
        user-select: text;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>تعذر تشغيل لوحة التحكم</h1>
      <p>تعذر تشغيل الخادم المحلي. أعد تشغيل البرنامج، وإذا استمرت المشكلة أرسل التفاصيل أدناه إلى الدعم الفني.</p>
      <pre id="reason" hidden></pre>
      <p class="logline" id="logline" hidden>حُفظت التفاصيل الكاملة في: <code id="logpath"></code></p>
    </main>
    <script>
      // main.js hands the failure over as query parameters; a page with no
      // parameters (opened by hand) just shows the generic text.
      const q = new URLSearchParams(location.search);
      const message = q.get('message');
      if (message) {
        const el = document.getElementById('reason');
        el.textContent = message;
        el.hidden = false;
      }
      const log = q.get('log');
      if (log) {
        document.getElementById('logpath').textContent = log;
        document.getElementById('logline').hidden = false;
      }
    </script>
  </body>
</html>
