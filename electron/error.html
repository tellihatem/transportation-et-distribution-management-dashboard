<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>لوحة التحكم</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(160deg, #0f172a 0%, #111827 50%, #020617 100%);
        color: #e5e7eb;
      }
      main {
        max-width: 32rem;
        padding: 2rem;
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 1rem;
        background: rgba(15, 23, 42, 0.8);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.5rem;
      }
      p {
        margin: 0;
        line-height: 1.6;
        color: #cbd5e1;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>تعذر تشغيل لوحة التحكم</h1>
      <p>تعذر تشغيل الخادم المحلي. أعد تشغيل البرنامج، وإذا استمرت المشكلة تواصل مع الدعم الفني.</p>
    </main>
  </body>
</html>
